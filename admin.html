<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Layanan Yogya Garut</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Nunito', 'sans-serif'] }, colors: { yogyaRed: '#E3232A', yogyaGreen: '#008A45', } } } }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style> 
        .hidden-view { display: none !important; } 
        /* Transisi halus untuk sidebar mobile */
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 h-screen overflow-hidden flex relative">

    <!-- LAYAR LOGIN -->
    <div id="loginScreen" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-yogyaGreen"></div>
            <img src="logo_yogya_garut.png" alt="Logo Yogya" class="w-32 mx-auto mb-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Portal Manajemen</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left mt-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">User ID</label>
                    <input type="text" id="userid" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yogyaGreen transition">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yogyaGreen transition">
                </div>
                <button type="submit" class="w-full bg-yogyaGreen text-white font-bold py-3 rounded-lg hover:bg-green-700 transition active:scale-95">Masuk</button>
            </form>
        </div>
    </div>

    <!-- OVERLAY GELAP UNTUK SIDEBAR MOBILE -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

    <!-- DASHBOARD SIDEBAR -->
    <aside id="sidebar" class="sidebar-transition fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 z-30 w-64 bg-white shadow-xl flex flex-col h-full border-r border-gray-100">
        <div class="p-6 text-center border-b border-gray-100 relative">
            <img src="logo_yogya_garut.png" alt="Logo" class="w-24 mx-auto mb-2">
            <p class="text-xs font-bold text-yogyaGreen uppercase tracking-wider">Admin Panel</p>
            <!-- Tombol Tutup Sidebar (Hanya Mobile) -->
            <button onclick="toggleSidebar()" class="md:hidden absolute top-4 right-4 text-gray-400 hover:text-red-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button onclick="switchTab('keluhan')" id="btn-keluhan" class="w-full text-left px-4 py-3 rounded-lg bg-red-50 text-yogyaRed font-bold flex items-center gap-3"><span>📨</span> Data Keluhan</button>
            <button onclick="switchTab('promo')" id="btn-promo" class="w-full text-left px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-50 font-bold flex items-center gap-3"><span>🏷️</span> Kelola Promo</button>
        </nav>
        <div class="p-4 border-t border-gray-100">
            <button onclick="handleLogout()" class="w-full px-4 py-2 text-sm text-gray-500 hover:text-red-500 font-bold flex items-center justify-center gap-2">Keluar (Logout)</button>
        </div>
    </aside>

    <!-- Main Content -->
    <div id="dashboardScreen" class="hidden-view flex-1 flex flex-col h-full overflow-hidden bg-gray-50 w-full">
        
        <!-- HEADER MOBILE (Hanya muncul di HP) -->
        <div class="md:hidden flex items-center justify-between bg-white p-4 shadow-sm z-10 w-full border-b border-gray-200">
            <div class="flex items-center gap-2">
                <img src="logo_yogya_garut.png" alt="Logo" class="
