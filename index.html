<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Layanan Pelanggan Yogya Garut</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Nunito', 'sans-serif'] }, colors: { yogyaRed: '#E3232A', yogyaGreen: '#008A45', yogyaYellow: '#FBD116', yogyaOrange: '#F47920' } } } }
    </script>
    <style>
        .hidden-view { display: none !important; } 
        .modal-enter { opacity: 0; transform: translateY(20px) scale(0.95); }
        .modal-enter-active { opacity: 1; transform: translateY(0) scale(1); transition: opacity 400ms ease-out, transform 400ms ease-out; }
        ::-webkit-scrollbar { display: none; }
        .view-hidden { display: none; }
        .view-enter { animation: fadeSlideUp 0.4s ease forwards; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .category-radio:checked + div { border-color: #E3232A; background-color: #fef2f2; color: #E3232A; }
        .swiper-pagination-bullet-active { background-color: #E3232A !important; }
        .skeleton { background: #e2e8f0; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        /* Styling Interaktif untuk Zoom Container */
        #promoLightboxImg {
            transform-origin: center center;
            transition: transform 0.1s ease-out;
            touch-action: none;
            cursor: grab;
        }
        #promoLightboxImg:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans relative overflow-x-hidden text-gray-800 max-w-md mx-auto shadow-2xl bg-white">

    <!-- MODAL POP-UP (WELCOME SCREEN) -->
    <div id="welcomeModal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center z-50 max-w-md mx-auto transition-opacity duration-300">
        <div id="modalContent" class="bg-white p-8 rounded-[2rem] text-center w-[85%] shadow-2xl modal-enter border border-gray-100">
            <div class="bg-gray-50 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner">
                <img src="logo_yogya_garut.png" alt="Yogya Garut" class="w-20">
            </div>
            <h2 class="text-2xl font-extrabold text-gray-800 mb-2">Halo, Selamat Datang!</h2>
            <p class="text-gray-500 mb-8 font-medium leading-relaxed">Senang melihat Anda di<br><span class="text-yogyaRed font-bold">Yogya Garut</span>. Ada yang bisa kami bantu hari ini?</p>
            <button onclick="closeModal()" class="bg-gradient-to-r from-yogyaRed to-red-500 text-white px-8 py-3.5 rounded-full font-bold text-lg hover:shadow-lg active:scale-95 transition-all w-full shadow-red-200/50 shadow-xl">
                Jelajahi Layanan
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow flex flex-col pt-12 px-6 relative z-10 w-full">
        <div class="text-center mb-8">
            <img src="logo_yogya_garut.png" alt="Logo Yogya Garut" class="w-48 mx-auto mb-4 drop-shadow-sm">
        </div>

        <!-- VIEW 1: MENU UTAMA -->
        <div id="menuView" class="w-full space-y-4 view-enter">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-extrabold text-gray-800 mb-1">Pusat Layanan</h1>
                <p class="text-sm text-gray-500 font-semibold">Pilih menu untuk melanjutkan</p>
            </div>
            <button onclick="toggleView('promoView'); loadCustomerPromo()" class="group w-full bg-gradient-to-br from-yogyaOrange to-yogyaYellow text-white p-1 rounded-3xl shadow-lg active:scale-[0.98] transition-all">
                <div class="bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-between p-4 px-6 h-full">
                    <div class="flex items-center gap-4">
                        <div class="bg-white text-yogyaOrange p-2 rounded-2xl shadow-sm"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg></div>
                        <span class="font-bold text-lg text-white drop-shadow-sm">Katalog Promo</span>
                    </div>
                    <svg class="w-6 h-6 opacity-70 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </button>
            <button onclick="toggleView('formView')" class="group w-full bg-gradient-to-br from-yogyaRed to-red-400 text-white p-1 rounded-3xl shadow-lg active:scale-[0.98] transition-all">
                <div class="bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-between p-4 px-6 h-full">
                    <div class="flex items-center gap-4">
                        <div class="bg-white text-yogyaRed p-2 rounded-2xl shadow-sm"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg></div>
                        <span class="font-bold text-lg text-white drop-shadow-sm">Keluhan & Saran</span>
                    </div>
                    <svg class="w-6 h-6 opacity-70 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </button>
            <button class="group w-full bg-gradient-to-br from-yogyaGreen to-emerald-400 text-white p-1 rounded-3xl shadow-lg active:scale-[0.98] transition-all">
                <div class="bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-between p-4 px-6 h-full">
                    <div class="flex items-center gap-4">
                        <div class="bg-white text-yogyaGreen p-2 rounded-2xl shadow-sm"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg></div>
                        <span class="font-bold text-lg text-white drop-shadow-sm">Digital Map</span>
                    </div>
                    <svg class="w-6 h-6 opacity-70 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </button>
        </div>

        <!-- VIEW 2: FORMULIR KELUHAN & SARAN -->
        <div id="formView" class="w-full view-hidden">
            <div class="flex items-center mb-6">
                <button onclick="toggleView('menuView')" class="p-2 bg-gray-100 rounded-full hover:bg-gray-200 active:scale-90 transition mr-4 text-gray-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg></button>
                <div>
                    <h2 class="text-xl font-extrabold text-gray-800">Sampaikan Masukan</h2>
