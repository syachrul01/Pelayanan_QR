<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Layanan Pelanggan Yogya Garut</title>
    
    <!-- Menggunakan Font 'Nunito' agar terlihat modern dan ramah -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Menginjeksi warna dari Logo Yogya Group ke dalam sistem Tailwind
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        yogyaRed: '#E3232A',
                        yogyaGreen: '#008A45',
                        yogyaYellow: '#FBD116',
                        yogyaOrange: '#F47920'
                    }
                }
            }
        }
    </script>
    <style>
        /* Animasi masuk modal yang lebih mulus (Glassmorphism) */
        .modal-enter {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: opacity 400ms ease-out, transform 400ms ease-out;
        }
        
        /* Menyembunyikan scrollbar tapi tetap bisa scroll */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<!-- Menggunakan max-w-md mx-auto agar di layar laptop pun tampilannya seperti layar HP (Mobile-First) -->
<body class="bg-gray-50 min-h-screen flex flex-col font-sans relative overflow-x-hidden text-gray-800 max-w-md mx-auto shadow-2xl bg-white">

    <!-- MODAL POP-UP (WELCOME SCREEN) -->
    <div id="welcomeModal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-300 max-w-md mx-auto">
        <div id="modalContent" class="bg-white p-8 rounded-[2rem] text-center w-[85%] shadow-2xl modal-enter border border-gray-100">
            <div class="bg-gray-50 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner">
                <img src="assets/logo_yogya_garut.png" alt="Yogya Garut" class="w-20">
            </div>
            <h2 class="text-2xl font-extrabold text-gray-800 mb-2">Halo, Selamat Datang!</h2>
            <p class="text-gray-500 mb-8 font-medium leading-relaxed">Senang melihat Anda di<br><span class="text-yogyaRed font-bold">Yogya Garut</span>. Ada yang bisa kami bantu hari ini?</p>
            <button onclick="closeModal()" class="bg-gradient-to-r from-yogyaRed to-red-500 text-white px-8 py-3.5 rounded-full font-bold text-lg hover:shadow-lg active:scale-95 transition-all w-full shadow-red-200/50 shadow-xl">
                Jelajahi Layanan
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow flex flex-col pt-12 px-6 relative z-10 w-full">
        
        <!-- Header Logo & Sambutan -->
        <div class="text-center mb-10">
            <img src="assets/logo_yogya_garut.png" alt="Logo Yogya Garut" class="w-48 mx-auto mb-6 drop-shadow-sm">
            <h1 class="text-2xl font-extrabold text-gray-800 mb-1">Pusat Layanan</h1>
            <p class="text-sm text-gray-500 font-semibold">Pilih menu untuk melanjutkan</p>
        </div>

        <!-- Container Tombol Menu (Berwarna & Interaktif) -->
        <div class="w-full space-y-4">
            
            <!-- Tombol 1: Promo (Kuning/Oranye) -->
            <button class="group w-full bg-gradient-to-br from-yogyaOrange to-yogyaYellow text-white p-1 rounded-3xl shadow-lg shadow-orange-200 active:scale-[0.98] transition-all">
                <div class="bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-between p-4 px-6 h-full">
                    <div class="flex items-center gap-4">
                        <!-- Icon Shopping Bag -->
                        <div class="bg-white text-yogyaOrange p-2 rounded-2xl shadow-sm">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        </div>
                        <span class="font-bold text-lg text-white drop-shadow-sm">Katalog Promo</span>
                    </div>
                    <svg class="w-6 h-6 opacity-70 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </button>
            
            <!-- Tombol 2: Keluhan dan Saran (Merah) -->
            <button class="group w-full bg-gradient-to-br from-yogyaRed to-red-400 text-white p-1 rounded-3xl shadow-lg shadow-red-200 active:scale-[0.98] transition-all">
                <div class="bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-between p-4 px-6 h-full">
                    <div class="flex items-center gap-4">
                        <!-- Icon Message/Feedback -->
                        <div class="bg-white text-yogyaRed p-2 rounded-2xl shadow-sm">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                        </div>
                        <span class="font-bold text-lg text-white drop-shadow-sm">Keluhan & Saran</span>
                    </div>
                    <svg class="w-6 h-6 opacity-70 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </button>
            
            <!-- Tombol 3: Digital Map (Hijau) -->
            <button class="group w-full bg-gradient-to-br from-yogyaGreen to-emerald-400 text-white p-1 rounded-3xl shadow-lg shadow-green-200 active:scale-[0.98] transition-all">
                <div class="bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-between p-4 px-6 h-full">
                    <div class="flex items-center gap-4">
                        <!-- Icon Map -->
                        <div class="bg-white text-yogyaGreen p-2 rounded-2xl shadow-sm">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                        </div>
                        <span class="font-bold text-lg text-white drop-shadow-sm">Digital Map</span>
                    </div>
                    <svg class="w-6 h-6 opacity-70 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </div>
            </button>

        </div>
    </main>

    <!-- FOOTER MODERN DENGAN SVG WAVE (GELOMBANG HIJAU) -->
    <footer class="mt-12 w-full flex-shrink-0 relative">
        <!-- SVG Gelombang -->
        <svg viewBox="0 0 1440 320" class="w-full h-auto -mb-1 block">
            <path fill="#008A45" fill-opacity="1" d="M0,128L48,144C96,160,192,192,288,197.3C384,203,480,181,576,160C672,139,768,117,864,122.7C960,128,1056,160,1152,165.3C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
        <!-- Area solid di bawah gelombang -->
        <div class="bg-yogyaGreen w-full pb-8 pt-2 flex flex-col items-center justify-center text-center">
            <p class="text-white/90 font-bold tracking-wide text-sm mb-1">YOGYA GROUP GARUT</p>
            <p class="text-white/60 text-xs">Melayani dengan senyum & sepenuh hati</p>
        </div>
    </footer>

    <!-- SCRIPT INTERAKSI -->
    <script>
        // Animasi Pop-up Muncul
        document.addEventListener('DOMContentLoaded', () => {
            const modalContent = document.getElementById('modalContent');
            setTimeout(() => {
                modalContent.classList.add('modal-enter-active');
            }, 100); // Sedikit jeda agar browser merender halaman dulu
        });

        // Logika Tutup Modal
        function closeModal() {
            const modal = document.getElementById('welcomeModal');
            const modalContent = document.getElementById('modalContent');
            
            modalContent.style.transform = 'translateY(-20px) scale(0.95)';
            modalContent.style.opacity = '0';
            modal.style.transition = 'opacity 300ms ease-in';
            modal.style.opacity = '0';
            
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
