<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Layanan Pelanggan Yogya Garut</title>
    
    <!-- Menggunakan Font 'Nunito' agar terlihat modern dan ramah -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Menginjeksi warna dari Logo Yogya Group ke dalam sistem Tailwind
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        yogyaRed: '#E3232A',
                        yogyaGreen: '#008A45',
                        yogyaYellow: '#FBD116',
                        yogyaOrange: '#F47920'
                    }
                }
            }
        }
    </script>
    <style>
        /* Animasi masuk modal yang lebih mulus (Glassmorphism) */
        .modal-enter {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: opacity 400ms ease-out, transform 400ms ease-out;
        }
        
        /* Menyembunyikan scrollbar tapi tetap bisa scroll */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
